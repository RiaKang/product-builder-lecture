<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제작 가성비 계산기 | Product Builder</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1234567890123456" crossorigin="anonymous"></script>
    
    <!-- Google Analytics (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>

    <!-- Microsoft Clarity -->
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "xxxxxxxxxx");
    </script>
</head>
<body>
    <div class="noise-bg"></div>
    <svg style="display: none;">
        <filter id="noiseFilter">
            <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" stitchTiles="stitch" />
            <feColorMatrix type="saturate" values="0" />
        </filter>
    </svg>
    <div class="theme-toggle-wrapper">
        <label class="theme-switch">
            <input type="checkbox" id="theme-checkbox">
            <span class="slider">
                <span class="icon sun">☀️</span>
                <span class="icon moon">🌙</span>
            </span>
        </label>
    </div>

    <main class="layout-container">
        <header>
            <h1>🛠️ 제작 계산기</h1>
            <p>재료비와 시간을 입력하여 최적의 수익을 계산하세요.</p>
        </header>

        <div class="content-wrapper">
            <crafting-app id="app"></crafting-app>
            <aside id="sidebar" class="sidebar">
                <div class="sidebar-header">
                    <h3>📁 저장된 레시피</h3>
                    <button class="save-recipe-btn">💾 현재 레시피 저장</button>
                </div>
                <div id="history-list" class="history-list">
                    <!-- History items will be injected here -->
                    <p class="empty-msg">저장된 데이터가 없습니다.</p>
                </div>
            </aside>
        </div>
    </main>

    <!-- Templates for Web Components -->
    <template id="ingredient-item-template">
        <style>
            :host {
                display: block;
                margin-bottom: 1rem;
            }
            .item-row {
                display: grid;
                grid-template-columns: 2fr 1fr 1fr 1fr auto;
                gap: 10px;
                align-items: center;
                background: rgba(255, 255, 255, 0.05);
                padding: 1rem;
                border-radius: 12px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                transition: all 0.3s ease;
            }
            .item-row:hover {
                background: rgba(255, 255, 255, 0.08);
                border-color: rgba(255, 255, 255, 0.2);
            }
            .item-row:focus-within {
                border-color: var(--primary-color);
                box-shadow: 0 0 15px var(--glow-color);
                background: rgba(255, 255, 255, 0.08);
            }
            input {
                background: rgba(0, 0, 0, 0.1);
                border: 1px solid rgba(128, 128, 128, 0.2);
                color: var(--text-color);
                padding: 0.5rem;
                border-radius: 6px;
                width: 100%;
                box-sizing: border-box;
            }
            input:focus {
                outline: none;
                border-color: var(--primary-color);
            }
            button.remove-btn {
                background: var(--danger-color);
                color: white;
                border: none;
                padding: 0.5rem 0.8rem;
                border-radius: 6px;
                cursor: pointer;
                font-weight: bold;
                transition: transform 0.2s;
            }
            button.remove-btn:hover {
                transform: scale(1.1);
                filter: brightness(1.2);
            }
            @container (max-width: 600px) {
                .item-row {
                    grid-template-columns: 1fr 1fr;
                }
                .name-col { grid-column: span 2; }
                .remove-col { grid-column: span 2; text-align: right; }
            }
        </style>
        <div class="item-row">
            <div class="name-col"><input type="text" placeholder="재료명" class="name-input"></div>
            <div><input type="number" placeholder="가격" class="price-input" min="0"></div>
            <div><input type="number" placeholder="수량" class="qty-input" min="1"></div>
            <div><input type="number" placeholder="시간(분)" class="time-input" min="0"></div>
            <div class="remove-col"><button class="remove-btn">×</button></div>
        </div>
    </template>

    <template id="crafting-app-template">
        <style>
            :host {
                display: block;
                max-width: 800px;
                margin: 0 auto;
                container-type: inline-size;
            }
            .card {
                background: var(--card-bg);
                backdrop-filter: blur(10px);
                border-radius: 20px;
                padding: 2rem;
                box-shadow: var(--shadow-deep);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
            .target-info {
                display: grid;
                grid-template-columns: 2fr 1fr auto;
                gap: 20px;
                align-items: end;
                margin-bottom: 2rem;
                padding-bottom: 2rem;
                border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
            }
            .save-btn-container {
                display: flex;
                justify-content: flex-end;
            }
            .ingredients-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 1rem;
            }
            .add-btn {
                background: var(--primary-color);
                color: white;
                border: none;
                padding: 0.8rem 1.5rem;
                border-radius: 30px;
                cursor: pointer;
                font-weight: bold;
                box-shadow: 0 4px 15px var(--glow-color);
                transition: all 0.3s ease;
            }
            .add-btn:hover {
                transform: translateY(-2px);
                filter: brightness(1.1);
            }
            .summary {
                margin-top: 2rem;
                padding: 1.5rem;
                background: rgba(255, 255, 255, 0.05);
                border-radius: 15px;
            }
            .result-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 15px;
                margin-top: 1rem;
            }
            .result-item {
                text-align: center;
                padding: 1rem;
                background: rgba(0, 0, 0, 0.2);
                border-radius: 10px;
            }
            .label { font-size: 0.8rem; color: rgba(255, 255, 255, 0.6); display: block; margin-bottom: 0.5rem; }
            .value { font-size: 1.2rem; font-weight: bold; }
            .profit-positive { color: var(--success-color); }
            .profit-negative { color: var(--danger-color); }
            
            label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
            input.main-input {
                font-size: 1.1rem;
                padding: 0.8rem;
                background: rgba(128, 128, 128, 0.05);
                border: 1px solid rgba(128, 128, 128, 0.2);
                color: var(--text-color);
                border-radius: 8px;
                width: 100%;
                box-sizing: border-box;
            }
            @container (max-width: 500px) {
                .target-info { grid-template-columns: 1fr; }
            }
        </style>
        <div class="card">
            <div class="target-info">
                <div>
                    <label>제작 물품명</label>
                    <input type="text" class="main-input target-name" placeholder="예: 전설의 검">
                </div>
                <div>
                    <label>물품 가격</label>
                    <input type="number" class="main-input target-price" placeholder="판매 가격 입력">
                </div>
            </div>

            <div class="ingredients-section">
                <div class="ingredients-header">
                    <h3>📦 필요 재료</h3>
                    <button class="add-btn">+ 재료 추가</button>
                </div>
                <div id="ingredients-list">
                    <!-- ingredient-item components will be injected here -->
                </div>
            </div>

            <div class="summary">
                <div class="summary-header">
                    <h3>📊 계산 결과</h3>
                </div>
                <div class="result-grid">
                    <div class="result-item">
                        <span class="label">총 제작 비용</span>
                        <span class="value total-cost">0</span>
                    </div>
                    <div class="result-item">
                        <span class="label">총 소요 시간</span>
                        <span class="value total-time">0</span>
                    </div>
                    <div class="result-item">
                        <span class="label">예상 순수익</span>
                        <span class="value net-profit">0</span>
                    </div>
                    <div class="result-item">
                        <span class="label">수익률</span>
                        <span class="value profit-margin">0%</span>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="main.js" type="module"></script>
</body>
</html>
